<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QQPilot</title>
    <style>
        @media (prefers-color-scheme: dark) {

            html {
                background-color: #111;
                color: #eee;

            }


            button {
                background-color: #222;
                border: 2px solid #444;
                transition: all 0.2s ease-in-out;
                color: #eee;

                &:hover {
                    background-color: #333;
                    scale: 0.95;

                }
            }
        }

        @media (prefers-color-scheme: light) {
            button {
                background-color: #eee;
                border: 2px solid #ccc;
                transition: all 0.2s ease-in-out;

                &:hover {
                    background-color: #bbb;
                    scale: 0.95;

                }
            }
        }

        * {
            transition: all 0.1s ease;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            place-items: center;
        }

        .container {
            display: flex;
            place-items: center;

        }

        @media (orientation: landscape) {
            .container {
                flex-direction: row;

            }

            #icon {
                width: min(40vw, 400px);
            }
        }

        @media (orientation: portrait) {
            .container {
                flex-direction: column;
            }
            
            #icon {
                width: min(80vw, 400px);
            }
        }

        button {
            padding: 1em 2em;
            margin-top: 1em;
            margin-right: 1em;
            /* border-style: ; */


        }



        a {
            outline: none;
            color: inherit;
        }

        .hide {
            display: none;
        }
        .content
        {
            margin: 1em;
        }
    </style>
</head>

<body>
    <div class="container">
        <div align="center">
            <img id="icon" src="assets/qqpilot.png">
        </div>
        <div class="content">
            <h1>QQPilot</h1>
            <div>使用纯图像识别技术实现 QQ 消息自动回复，极大降低封号风险。</div>
            <button onclick="document.querySelector('#gh').click() ">
                Github
            </button>
            <button onclick="document.querySelector('#rel').click()">
                releases

            </button>
        </div>
    </div>
    <a href="https://github.com/Na2Cr2O7/QQPilot/tree/main" class="hide" id="gh">

    </a>
    <a href="https://github.com/Na2Cr2O7/QQPilot/releases" class="hide" id="rel"> </a>
</body>

</html>
