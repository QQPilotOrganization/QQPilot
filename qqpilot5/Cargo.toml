[package]
name = "qqpilot5"
version = "1.5.21"
edition = "2024"

[dependencies]
configparser = "3.3.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = [
    "blocking",
    "json",
    "native-tls",
] }
libloading = "0.8"
serde_json = { version = "1", features = ["preserve_order"] }
percent-encoding = "2"
base64 = "0.22"
md-5 = "0.10"
arboard = { version = "3", default-features = false }
chrono = "0.4"
rand = "0.9"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_JobObjects",
] }
windows-version = "0.1.7"
current_locale = "0.1.1"
anyhow = "1.0.104"
file-rotate = "0.8.0"











[profile.release]
strip = true
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'
