[package]
name = "option3"
version = "1.5.21"
edition = "2024"

[dependencies]

native-windows-gui = { version = "1.0.13", features = ["high-dpi"] }
native-windows-derive = "1.0.5"

configparser = { version = "3.3.0", features = ["indexmap"] }

serde_json = { version = "1", features = ["preserve_order"] }
winapi = { version = "0.3", features = ["winuser"] }
current_locale = "0.1.1"

reqwest = { version = "0.13.5", default-features = false, features = [
    "blocking",
    "json",
    "native-tls",
] }













[profile.release]
strip = true
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'
