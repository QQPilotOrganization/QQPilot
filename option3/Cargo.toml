[package]
name = "option3"
version = "1.5.20"
edition = "2024"

[dependencies]
# high-dpi 让 builder 里的坐标按"逻辑像素"处理并自动换算成物理像素，
# 与 C# 版 WinForms（SystemAware + AutoScaleMode.Font）在高分屏上的表现一致。
native-windows-gui = { version = "1.0.13", features = ["high-dpi"] }
native-windows-derive = "1.0.5"
# indexmap 特性用于保持 config.ini 里的键顺序，写回时不会打乱文件。
configparser = { version = "3.3.0", features = ["indexmap"] }
# preserve_order 让生成的 localization.json 保持声明顺序。
serde_json = { version = "1", features = ["preserve_order"] }
# 只为了 GetWindowRect / GetClientRect：把 C# 的 ClientSize 换算成窗口外框尺寸。
# native-windows-gui 本身就依赖 winapi 0.3，不会多引入东西。
winapi = { version = "0.3", features = ["winuser"] }
current_locale = "0.1.1"
# 连通性测试要发一次 HTTP 请求。特性与 qqpilot5 保持一致：native-tls 在 Windows
# 上走 schannel，不需要 C / cmake 工具链；用默认特性会拉上 rustls + aws-lc-sys，
# 那玩意儿要现场编译一堆 C，本机直接编不过。
reqwest = { version = "0.13.5", default-features = false, features = [
    "blocking",
    "json",
    "native-tls",
] }













[profile.release]
strip = true
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'
