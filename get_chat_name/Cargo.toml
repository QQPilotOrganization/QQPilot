[package]
name = "get_chat_name"
version = "1.5.21"
edition = "2024"

[dependencies]
windows = { version = "0.58", features = [
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage",
    "Storage_Streams",
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Win32_System_WinRT",
    "Win32_System_Console",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi"
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
configparser = "3.3.0"
